# Protocol record; executable stage membership is in targets.py and run.py.
model: d + sum(c * tanh(a*x+b))
trainable: [a, b, c, d]
coordinates: physical_raw
loss: half_mse
optimizer: simultaneous_full_batch_gd
precision: float64
geometry_lr: 0.002
readout_geometry_ratios: [0.0001, 0.001, 0.01, 0.1, 1, 10, 100]
width_budgets: [[64, 12, 89], [128, 24, 177], [256, 48, 353]]
core_seeds: [0, 1, 2, 3, 4]
replication_seeds: [5, 6, 7, 8, 9]
targets: [sine, runge, moment3, moment5, moment9]
reference_activation_degrees: [1, 3, 5, 7]
train_midpoints: 2048
evaluation_midpoints: 8192
minimum_updates: 20000
continuation_block: 20000
half_step_geometry_lr: 0.001
half_step_updates: 40000
raw_gamma_thresholds: [1, 4, 16]
lambda_thresholds: [0.05, 0.1, 0.25]
population_thresholds: [0.1, 0.5]
coarse_residual_thresholds: [0.1, 0.01]
snapshot_stride_after_update_20: 20
pointwise_moment_orders: [2, 4, 6, 8]
maximum_simultaneous_gpus: 2
